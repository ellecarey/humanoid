run_name: demo
videos:
  v1: data/raw_videos/scene_v1.MOV
  v2: data/raw_videos/scene_v2.MOV
output_root: outputs
ground_truth: data/ground_truth/changes.json

frames:
  target_fps: 6.0              # candidates extracted per second
  window_s: 0.5                # keep the sharpest candidate per window (~2 fps over the whole walk)
  max_per_video: 100           # both videos go through one MapAnything pass
  max_width: 1280
  duplicate_threshold: 0.98    # thumbnail correlation above which a frame repeats the last one
  min_relative_sharpness: 0.25 # windows far blurrier than the video median may be dropped...
  max_gap_s: 1.0               # ...unless that leaves about 1 s or more without a frame

recon:
  model: facebook/map-anything
  voxel_size: 0.015
  conf_percentile: 15          # MapAnything drops the least confident pixels
  min_confidence: 0.0
  scale_m_per_unit: 1.0        # VGGT fallback only; MapAnything is already metric
  icp: true
  icp_voxels_m: [0.05, 0.02, 0.01]
  min_self_views: 2            # a point must be re-observed in its own video
  self_margin_m: 0.04
  self_margin_rel: 0.025

features:
  enabled: true
  model: dinov2_vits14
  scale: 2.0                   # 518x294 input -> 74x42 patch grid
  pca_dim: 64

diff:
  change_distance_m: 0.05

visibility:
  depth_margin_m: 0.04
  depth_margin_rel: 0.025      # margin grows with depth: max(abs, rel * z)
  min_free_views: 3
  free_ratio: 0.6              # free / (free + agree) among the other video's views
  min_agree_views: 5           # one badly exposed frame cannot flag a surface
  appearance_cos: 0.4          # below this the same surface looks different
  center_features: true        # remove each video's mean feature (exposure shift)
  min_confidence: 0.0

cluster:
  dbscan_eps_m: 0.05
  dbscan_min_samples: 10
  min_points: 150              # a pillow is ~500 points at 1.5 cm voxels
  min_extent_m: 0.05
  max_extent_m: 1.5
  min_height_above_floor_m: 0.05
  merge_dist_m: 0.25
  floor_max_tilt_deg: 20.0

vlm:
  provider: gemini
  model: gemini-3.8-flash
  cache: true
  pair_abs_tol_m: 0.15
  pair_rel_tol: 0.3
  retries: 3                   # on 429 / 500 / 503, waiting 10, 20, 40 s
  retry_wait_s: 10.0

labeler:                       # local CLIP; used without a Gemini key or when Gemini fails
  enabled: true
  model: openai/clip-vit-large-patch14
  box_pads: [0.15, 0.5]        # crop paddings tried; the one CLIP is surest about wins
  min_objectness: 0.5          # share of CLIP probability on object (not wall/floor/furniture) classes
  # appearance regions only (geometry regions already have free-space evidence):
  max_label_ratio: 0.7         # P(label | other video's crop) / P(label | own crop); higher = object still there
  max_same_similarity: 0.95    # crops this alike in both videos are not a change
  pair_min_similarity: 0.75    # removed and added halves of a move must look alike
