run_name: demo
videos:
  v1: data/raw_videos/scene_v1.MOV
  v2: data/raw_videos/scene_v2.MOV
output_root: outputs

frames:
  target_fps: 4.0          # 30 fps video -> keep every 7th or 8th frame
  max_frames: 12
  max_width: 1280
  blur_threshold: 80.0     # Laplacian variance; raise if too many frames survive
  duplicate_threshold: 0.98

recon:
  model: facebook/map-anything
  max_frames: 12
  voxel_size: 0.015
  min_confidence: 1.5
  scale_m_per_unit: 1.0   # VGGT fallback only; MapAnything is already metric

vlm:
  provider: gemini
  model: gemini-2.5-flash
  cache: true

diff:
  change_distance_m: 0.03

visibility:
  depth_margin_m: 0.05
  min_confirming_views: 2
  min_confidence: 1.5

cluster:
  dbscan_eps_m: 0.05
  dbscan_min_samples: 15
  min_points: 40
  min_extent_m: 0.03
  max_extent_m: 1.5
  min_height_above_floor_m: 0.05
