[project]
name = "humanoid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ellecarey", email = "elle.carey@yahoo.co.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "open3d",
    "scipy",
    "scikit-learn",
    "pydantic>=2",
    "pyyaml",
    "typer",
    "rerun-sdk",
    "tqdm",
]
[project.optional-dependencies]
gpu = ["torch", "pycolmap", "transformers"]
vlm = ["openai", "google-genai"]
[project.scripts]
humanoid = "humanoid.cli:app"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
